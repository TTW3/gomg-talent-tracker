name: Update GOMG game data

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update game-data.json
        run: python3 tools/update_game_data.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-data.json
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "chore: update GOMG game data"
            git push
          fi

name: Update Trait Title Perk data

on:
  workflow_dispatch:
  schedule:
    - cron: '47 2 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Refresh Trait Title Perk data
        run: python tools/update_character_extras.py

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- character-extras.json; then
            echo 'No Trait / Title / Perk changes.'
          else
            git add character-extras.json
            git commit -m 'chore: update Trait Title Perk data'
            git push
          fi
